<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipp4th</title>

  <!-- App deep link meta (update when live) -->
  <meta property="al:ios:app_store_id" content="YOUR_APP_STORE_ID">
  <meta property="al:ios:app_name" content="Flipp4th">
  <meta property="al:ios:url" content="flipp4th://">
  <meta property="al:android:package" content="com.heliodolores.flipp4th">
  <meta property="al:android:app_name" content="Flipp4th">
  <meta property="al:android:url" content="flipp4th://">

  <!-- Open Graph for share previews -->
  <meta property="og:title" content="Flipp4th - Flip Puzzle Game">
  <meta property="og:description" content="Can you solve this puzzle? Try it in Flipp4th!">
  <meta property="og:type" content="website">
  <!-- <meta property="og:image" content="https://flipp4th.app/og-image.png"> -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F8F3E9;
      color: #3B342A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 480px;
    }

    .logo-img {
      width: 220px;
      height: auto;
      margin-bottom: 0.75rem;
    }

    .tagline {
      font-size: 1.1rem;
      font-weight: 600;
      color: #A89D89;
      margin-bottom: 2.5rem;
    }

    .shared-level {
      background: #FFF8ED;
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid rgba(74,58,28,0.1);
    }

    .shared-level h2 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #3B342A;
      margin-bottom: 0.4rem;
    }

    .shared-level p {
      color: #A89D89;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .store-buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    .store-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.9rem 2rem;
      border-radius: 14px;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 800;
      width: 260px;
      transition: transform 0.15s, opacity 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .store-btn:hover {
      transform: scale(1.03);
    }

    .store-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .store-btn.ios {
      background: #3B342A;
      color: #F8F3E9;
    }

    .store-btn.android {
      background: #7FA06A;
      color: #fff;
    }

    .store-btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #C4BAA8;
    }

    /* Hide sections based on detected platform */
    body.is-ios .store-btn.android { display: none; }
    body.is-android .store-btn.ios { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo-img" src="logo.png" alt="Flipp4th">

    <p class="tagline">A flip puzzle game</p>

    <!-- Shown only when ?s= param is present -->
    <div class="shared-level" id="shared-section" style="display:none">
      <h2>Someone shared a puzzle with you!</h2>
      <p>Download Flipp4th to play it.</p>
    </div>

    <div class="store-buttons">
      <a class="store-btn ios" id="ios-btn"
         href="https://apps.apple.com/app/idYOUR_APP_STORE_ID">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        App Store
      </a>

      <a class="store-btn android" id="android-btn"
         href="https://play.google.com/store/apps/details?id=com.heliodolores.flipp4th">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.18 23.04L14.56 12 3.18.96a1.38 1.38 0 00-.18.7v20.68c0 .26.06.5.18.7zm1.44.82L16.4 13.34l-2.47-2.47L4.62 23.86zM20.15 10.7l-3.2-1.84-2.73 2.73 2.73 2.73 3.2-1.84c.6-.34.97-.96.97-1.64s-.37-1.3-.97-1.64zM4.62.14l9.31 12.99 2.47-2.47L4.62.14z"/></svg>
        Google Play
      </a>
    </div>
  </div>

  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var params = new URLSearchParams(window.location.search);
      var shareCode = params.get('s');
      var isIOS = /iPhone|iPad|iPod/.test(ua);
      var isAndroid = /Android/.test(ua);

      // Show shared level section if ?s= is present
      if (shareCode) {
        document.getElementById('shared-section').style.display = '';
      }

      // Add platform class for CSS hiding
      if (isIOS) document.body.classList.add('is-ios');
      if (isAndroid) document.body.classList.add('is-android');

      // On mobile with a share code, try to open the app first
      if (shareCode && (isIOS || isAndroid)) {
        if (isAndroid) {
          // Android: intent URI tries app, falls back to Play Store
          var intent = 'intent://share?s=' + encodeURIComponent(shareCode) +
            '#Intent;scheme=flipp4th;package=com.heliodolores.flipp4th;' +
            'S.browser_fallback_url=' + encodeURIComponent(
              'https://play.google.com/store/apps/details?id=com.heliodolores.flipp4th'
            ) + ';end';
          document.getElementById('android-btn').href = intent;
        }
      }
    })();
  </script>
</body>
</html>
